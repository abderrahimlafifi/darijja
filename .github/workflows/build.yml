name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TalkTranslate.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TalkTranslate
          path: TalkTranslate.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Talk Translate 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: TalkTranslate.apk
          body: |
            Debug signed APK, ready to install on Android 7 and newer.
            Download TalkTranslate.apk below and open it on your phone.
