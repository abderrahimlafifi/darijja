name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform 34 and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug :browser:testDebugUnitTest

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TalkTranslate.apk
          cp browser/build/outputs/apk/debug/browser-debug.apk CleanBrowser.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            TalkTranslate.apk
            CleanBrowser.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Talk Translate + Clean Browser 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            TalkTranslate.apk
            CleanBrowser.apk
          body: |
            Debug signed APKs.
            - CleanBrowser.apk: ad blocking browser with favorites, for phones and Android TV / Google TV (Android 5.0 and newer).
            - TalkTranslate.apk: Arabic voice conversation translator (Android 7 and newer).
