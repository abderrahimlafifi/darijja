plugins {
    id 'com.android.application'
}

// On GitHub Actions the run number becomes the version code, so every new
// build installs on top of the previous one without uninstalling.
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.cleanbrowser.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cleanbrowser.app'
        // Android 5.0 and newer: every Poco X3 NFC / Xiaomi TV software version.
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    signingConfigs {
        // Same fixed debug key as the other app, so updates keep the same signature.
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
